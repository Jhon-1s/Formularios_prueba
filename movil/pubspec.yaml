name: movil
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # ✅ UI y Core
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  
  # ✅ HTTP y Red
  http: ^1.2.2
  connectivity_plus: ^6.0.0
  
  # ✅ Almacenamiento Local
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  
  # ✅ Cámara y Archivos
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  image: ^4.3.0
  
  # ✅ Ubicación (GPS)
  geolocator: ^13.0.1
  
  # ✅ Firma Digital
  signature: ^5.5.0
  
  # ✅ Otros
  open_file: ^3.3.2
  provider: ^6.1.2
  intl: ^0.19.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
